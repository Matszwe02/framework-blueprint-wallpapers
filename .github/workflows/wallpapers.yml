name: Render wallpapers

# On every push: render every laptop in both aspect ratios: a 1920 px, 30 fps video and three 4K (3840 px) stills each,
# then replace the assets of the single "wallpapers" release with the fresh files.
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# a newer commit makes the running render pointless
concurrency:
  group: wallpapers
  cancel-in-progress: true

jobs:
  render:
    name: ${{ matrix.laptop }} ${{ matrix.aspect }}
    runs-on: ubuntu-latest
    timeout-minutes: 340                      # a 1080p30 render takes ~35-45 min on a fast CPU; the hosted runners are slower
    strategy:
      fail-fast: true
      matrix:
        laptop: [fw13pro, fw13, fw12, fw16]
        aspect: ["16:9", "3:2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Ubuntu's blender package links the system libembree4 and segfaults in rtcSetSharedGeometryBuffer while building the BVH,
      # so use the official Blender build (bundled Embree) instead.
      - name: Install Blender (official 4.0.2 build), ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libfontconfig1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libegl1
          curl -fsSL https://download.blender.org/release/Blender4.0/blender-4.0.2-linux-x64.tar.xz | tar -xJ -C "$RUNNER_TEMP"
          echo "BLENDER=$RUNNER_TEMP/blender-4.0.2-linux-x64/blender" >> "$GITHUB_ENV"
          pip install -r requirements.txt

      - name: Render video (1920 px, 30 fps)
        run: python run.py --laptop ${{ matrix.laptop }} --width 1920 --aspect ${{ matrix.aspect }} --fps 30 --speed 1.5 --label-speed 1 --idle-closed 2 --idle-open 2 --idle-exploded 2 --blender "$BLENDER" --yes

      - name: Export the three still images (4K, rendered separately from the video frames)
        run: python run.py --laptop ${{ matrix.laptop }} --stills --width 3840 --aspect ${{ matrix.aspect }} --blender "$BLENDER" --yes

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.laptop }}-${{ matrix.aspect == '3:2' && '3x2' || '16x9' }}
          path: out/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Update release
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: wallpapers
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Publish to the release
        run: |
          ls -l files
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Framework Blueprint Wallpapers" --notes ""
          fi
          gh release upload "$TAG" files/* --repo "$GITHUB_REPOSITORY" --clobber
          # drop assets that this run did not produce (renamed or removed outputs)
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | while read -r name; do
            [ -e "files/$name" ] || gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
          done
